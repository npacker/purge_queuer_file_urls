services:

  # PLUGIN.MANAGER.EXPRESSION_STRATEGY
  #
  # Plugin manager for expression strategy plugins.
  plugin.manager.expression_strategy:
    class: Drupal\purge_queuer_file_urls\Plugin\PurgeQueuerFileUrls\ExpressionStrategy\ExpressionStrategyManager
    parent: default_plugin_manager

  # PURGE_QUEUER_FILE_URLS.FILE_URL_EXPRESSION_FACTORY
  #
  # Provides a service object to create file url expressions.
  purge_queuer_file_urls.url_expression_factory:
    class: Drupal\purge_queuer_file_urls\UrlExpressionFactory
    factory: [null, 'create']
    arguments: ['@config.factory', '@plugin.manager.expression_strategy']

  # PURGE_QUEUER_FILE_URLS.FILE_URL_QUEUER
  #
  # Provides a file urls purge queuer the connects to the necessary purge
  # services to perform URL invalidation.
  purge_queuer_file_urls.file_url_queuer:
    class: Drupal\purge_queuer_file_urls\FileUrlQueuer
    factory: [null, 'create']
    arguments: ['@purge.invalidation.factory', '@purge.queue', '@purge.queuers']

  # PURGE_QUEUER_FILE_URLS.IMAGE_STYLE_URL_QUEUER
  #
  # Provides a file urls purge queuer the connects to the necessary purge
  # services to perform URL invalidation.
  purge_queuer_file_urls.image_style_url_queuer:
    class: Drupal\purge_queuer_file_urls\ImageStyleUrlQueuer
    factory: [null, 'create']
    arguments: ['@purge.invalidation.factory', '@purge.queue', '@purge.queuers']

  # PURGE_QUEUER_FILE_URLS.FILE_URL_COLLECTOR
  #
  # Provides a service object to collect file urls.
  purge_queuer_file_urls.file_url_collector:
    class: Drupal\purge_queuer_file_urls\FileUrlCollector
    arguments: ['@plugin.manager.field.field_type', '@entity_field.manager', '@purge_queuer_file_urls.url_expression_factory']

  # PURGE_QUEUER_FILE_URLS.IMAGE_STYLE_URL_COLLECTOR
  #
  # Provides a service object to collect image style urls.
  purge_queuer_file_urls.image_style_url_collector:
    class: Drupal\purge_queuer_file_urls\ImageStyleUrlCollector
    arguments: ['@plugin.manager.field.field_type', '@entity_field.manager', '@purge_queuer_file_urls.url_expression_factory']
