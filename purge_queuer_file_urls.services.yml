services:

  # Plugin manager for expression strategy plugins.
  plugin.manager.expression_strategy:
    class: Drupal\purge_queuer_file_urls\Plugin\PurgeQueuerFileUrls\ExpressionStrategy\ExpressionStrategyManager
    parent: default_plugin_manager

  # Service for generating URLs that respects the configured value for
  # purge_queuer_file_urls.settings.absolute_urls.
  purge_queuer_file_urls.file_url_generator:
    class: Drupal\purge_queuer_file_urls\Service\IterableFileUrlGenerator
    factory: [null, 'create']
    arguments:
      - '@file_url_generator'
      - '@config.factory'

  # Configurator for classes implementing the AllowedUriSchemesAwareInterface.
  Drupal\purge_queuer_file_urls\Service\AllowedUriSchemesAwareConfigurator:
    arguments:
      - '@config.factory'

  # Service for filtering file URLs and URIs based on a set of stream wrappers.
  purge_queuer_file_urls.stream_wrapper_filter:
    class: Drupal\purge_queuer_file_urls\Service\StreamWrapperFilterService
    arguments:
      - '@stream_wrapper_manager'
    configurator: ['@Drupal\purge_queuer_file_urls\Service\AllowedUriSchemesAwareConfigurator', 'configure']

  # Default URL expression factory implementation.
  Drupal\purge_queuer_file_urls\UrlExpressionFactory:
    factory: [null, 'create']
    arguments:
      - '@config.factory'
      - '@plugin.manager.expression_strategy'

  # URL expression factory decorator that filters based on file scheme.
  Drupal\purge_queuer_file_urls\SchemeFilteredUrlExpressionFactory:
    decorates: Drupal\purge_queuer_file_urls\UrlExpressionFactory
    arguments:
      - '@.inner'
      - '@purge_queuer_file_urls.stream_wrapper_filter'

  # Provides a service object to create file url expressions.
  purge_queuer_file_urls.url_expression_factory: '@Drupal\purge_queuer_file_urls\SchemeFilteredUrlExpressionFactory'

  # Base URL queuer service.
  Drupal\purge_queuer_file_urls\UrlQueuerBase:
    abstract: true
    factory: [null, 'create']
    arguments:
      - '@purge.invalidation.factory'
      - '@purge.queue'
      - '@purge.queuers'

  # Provides a file urls purge queuer the connects to the necessary purge
  # services to perform URL invalidation.
  purge_queuer_file_urls.file_url_queuer:
    class: Drupal\purge_queuer_file_urls\FileUrlQueuer
    parent: Drupal\purge_queuer_file_urls\UrlQueuerBase

  # Provides a file urls purge queuer the connects to the necessary purge
  # services to perform URL invalidation.
  purge_queuer_file_urls.image_style_url_queuer:
    class: Drupal\purge_queuer_file_urls\ImageStyleUrlQueuer
    parent: Drupal\purge_queuer_file_urls\UrlQueuerBase
